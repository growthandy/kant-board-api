[project]
name = "board-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.163.1",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
